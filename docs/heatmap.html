<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05080b">
  <title>RMUC 2026 · 战队位置热图</title>
  <link rel="stylesheet" href="./heatmap.css?v=1">
</head>
<body>
  <header class="heat-nav">
    <a class="heat-brand" href="./index.html">RMUC 2026 DATA</a>
    <nav aria-label="数据页面">
      <a href="./index.html">比赛回放</a>
      <a class="active" href="./heatmap.html">战队热图</a>
    </nav>
  </header>

  <main>
    <section class="heat-hero">
      <span>REGIONAL POSITION DENSITY</span>
      <h1>96 支战队位置热图</h1>
      <p>613 局区域赛存活机器人位置 · 0.1m 等距分辨率 · 二维高斯核位置估计</p>
      <div class="heat-metrics">
        <div><b id="metric-teams">96</b><span>支队伍</span></div>
        <div><b id="metric-resolution">280 × 150</b><span>密度分辨率</span></div>
        <div><b id="metric-sigma">σ 0.22m</b><span>单点位置误差</span></div>
      </div>
    </section>

    <section class="heat-controls" aria-label="热图筛选">
      <div class="filter-row">
        <span>赛区</span>
        <div id="region-filters" class="pills"></div>
      </div>
      <div class="filter-row">
        <span>显示</span>
        <div class="pills">
          <button class="pill" type="button" data-side="bilateral">双边原位</button>
          <button class="pill active" type="button" data-side="canonical">统一红方</button>
        </div>
      </div>
      <div class="school-heading">
        <span>学校</span>
        <label><span class="sr-only">搜索学校</span><input id="school-search" type="search" placeholder="搜索 96 支队伍"></label>
      </div>
      <div id="school-filters" class="school-list" aria-label="学校列表"></div>
    </section>

    <section class="heat-view">
      <div class="heat-view-head">
        <div>
          <span id="selected-region">载入中</span>
          <h2 id="selected-school">战队位置热图</h2>
        </div>
        <div id="selected-stats" class="selected-stats">读取轨迹数据…</div>
      </div>
      <div id="heatmap-stage" class="heatmap-stage">
        <img id="field-image" src="./assets/map.webp" alt="RMUC 2026 战场地图">
        <canvas id="heatmap-canvas" aria-label="战队位置密度热图"></canvas>
        <div id="heatmap-loading" class="heatmap-loading">载入热图…</div>
      </div>
      <div class="heat-legend">
        <span>低频</span><i></i><span>高频</span>
        <b>每个位置样本以 σ=0.22m 的二维正态分布展开</b>
      </div>
    </section>
  </main>

  <footer>
    <span>位置热图独立于单场比赛回放</span>
    <a href="https://github.com/MicDZ/RM_LADDER/blob/main/analysis.html" target="_blank" rel="noreferrer">交互表达参考 RM_LADDER</a>
  </footer>
  <script src="./heatmap.js?v=1"></script>
</body>
</html>
